<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Portfolio Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    body {
      background-color: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo {
      font-family: var(--font-heading, 'Bitter', serif);
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13.5px;
      color: #64748b;
    }
    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .auth-alert.error {
      display: block;
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .auth-alert.success {
      display: block;
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .auth-label {
      font-size: 12.5px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      display: block;
    }
    .auth-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      color: #0f172a;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-input:focus {
      outline: none;
      border-color: #0f172a;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
    }
    .auth-btn {
      width: 100%;
      padding: 11px;
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 6px;
    }
    .auth-btn:hover {
      background-color: #1e293b;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12.5px;
      color: #94a3b8;
    }
    .auth-footer a {
      color: #475569;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card" id="authCard">
    <!-- Login State View -->
    <div id="loginView">
      <div class="auth-header">
        <div class="auth-logo">Admin Panel</div>
        <div class="auth-subtitle">Sign in to manage your portfolio content</div>
      </div>

      <div id="loginAlert" class="auth-alert"></div>

      <form id="loginForm" class="auth-form" autocomplete="on">
        <div>
          <label for="username" class="auth-label">Username</label>
          <input type="text" id="username" name="username" class="auth-input" required autofocus autocomplete="username" placeholder="admin">
        </div>
        <div>
          <label for="password" class="auth-label">Password</label>
          <input type="password" id="password" name="password" class="auth-input" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" id="loginBtn" class="auth-btn">Sign In</button>
      </form>
    </div>

    <!-- Mandatory Password Change View (triggered on first login) -->
    <div id="changePasswordView" style="display: none;">
      <div class="auth-header">
        <div class="auth-logo">Change Password</div>
        <div class="auth-subtitle">Please set a new password of your choice (minimum 8 characters) to secure your account.</div>
      </div>

      <div id="changeAlert" class="auth-alert"></div>

      <form id="changePasswordForm" class="auth-form">
        <div>
          <label for="newPassword" class="auth-label">New Password (min 8 characters)</label>
          <input type="password" id="newPassword" name="newPassword" class="auth-input" required minlength="8" placeholder="e.g. MySecretPass123!" autofocus>
        </div>
        <div>
          <label for="confirmPassword" class="auth-label">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="auth-input" required minlength="8" placeholder="Repeat your new password">
        </div>
        <button type="submit" id="changeBtn" class="auth-btn">Update Password &amp; Continue</button>
        <button type="button" id="keepDefaultBtn" class="auth-btn" style="background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; margin-top: 6px;">Keep Default Password for Now</button>
      </form>
    </div>

    <div class="auth-footer">
      <a href="/" target="_blank">← Back to public portfolio</a>
    </div>
  </div>

  <script>
    let csrfToken = null;

    // Check if already logged in
    async function checkSession() {
      try {
        const res = await fetch('/admin/api/me');
        if (res.ok) {
          const data = await res.json();
          csrfToken = data.csrfToken;
          if (data.user?.mustChangePassword) {
            showChangePassword();
          } else {
            window.location.href = '/admin';
          }
        }
      } catch (err) {
        // Not logged in, stay on login view
      }
    }

    async function ensureCsrf() {
      if (!csrfToken) {
        try {
          const res = await fetch('/admin/api/csrf-token');
          if (res.ok) {
            const data = await res.json();
            csrfToken = data.csrfToken;
          }
        } catch (e) {}
      }
      return csrfToken;
    }

    function showChangePassword() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('changePasswordView').style.display = 'block';
      setTimeout(() => document.getElementById('newPassword')?.focus(), 100);
    }

    // Login Form Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('loginBtn');
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      const username = e.target.username.value.trim();
      const password = e.target.password.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Invalid username or password');
        }

        csrfToken = data.csrfToken;

        if (data.user?.mustChangePassword) {
          showChangePassword();
        } else {
          window.location.href = '/admin';
        }
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.className = 'auth-alert error';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Forced Password Change Form Handler
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('changeAlert');
      const submitBtn = document.getElementById('changeBtn');
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      const newPassword = e.target.newPassword.value;
      const confirmPassword = e.target.confirmPassword.value;

      if (!newPassword || newPassword.length < 8) {
        alertBox.textContent = 'Password must be at least 8 characters long.';
        alertBox.className = 'auth-alert error';
        alertBox.style.display = 'block';
        return;
      }

      if (newPassword !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.className = 'auth-alert error';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        await ensureCsrf();
        const res = await fetch('/admin/api/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken
          },
          body: JSON.stringify({ newPassword })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to change password');
        }

        alertBox.textContent = 'Password changed successfully! Redirecting to dashboard...';
        alertBox.className = 'auth-alert success';
        alertBox.style.display = 'block';
        setTimeout(() => {
          window.location.href = '/admin';
        }, 800);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.className = 'auth-alert error';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password & Continue';
      }
    });

    // Keep Default Password button handler
    document.getElementById('keepDefaultBtn')?.addEventListener('click', async () => {
      const alertBox = document.getElementById('changeAlert');
      const btn = document.getElementById('keepDefaultBtn');
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      btn.disabled = true;
      btn.textContent = 'Continuing...';

      try {
        await ensureCsrf();
        const res = await fetch('/admin/api/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-csrf-token': csrfToken
          },
          body: JSON.stringify({ newPassword: 'ChangeMe123!' })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to update');

        alertBox.textContent = 'Welcome! Redirecting to dashboard...';
        alertBox.className = 'auth-alert success';
        alertBox.style.display = 'block';
        setTimeout(() => {
          window.location.href = '/admin';
        }, 600);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.className = 'auth-alert error';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Keep Default Password for Now';
      }
    });

    checkSession();
  </script>
</body>
</html>
